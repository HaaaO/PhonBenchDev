# @package _global_

# Run inference with the HuPER edit-sequence Corrector.
# The Corrector takes (audio, canonical phoneme sequence) and predicts the
# realized phoneme sequence. Canonical phonemes are loaded from a Kaldi-style
# text.canonical file (IPA) at builder time and looked up by utt_id at call.
# Outputs are mapped from ARPAbet to IPA so they line up with PhonBench's
# other phoneme models.
#
# Required override: inference.inference_runner.canonical_file
#
# Example:
#   python src/main.py \
#     experiment=inference/transcribe_huper_corrector \
#     data=powsmeval data.dataset_name=test_l2arctic_perceived \
#     inference.inference_runner.canonical_file=$DATA_DIR/test_l2arctic_perceived/text.canonical \
#     task_name=inf_test_l2arctic_perceived_huper_corrector

defaults:
  - override /logger: csv
  - override /model: null
  - override /model/net: null

task_name: ???
tags: ["huper", "inference", "corrector"]

seed: 42

train: false
test: false
distributed_predict: True

inference:
  num_workers: 5
  passthrough_keys: ["target", "split", "utt_id", "metadata_idx", "lang_sym"]
  out_file: ${paths.output_dir}/transcription.json
  inference_runner:
    _target_: src.model.huper.builders.build_huper_corrector_inference
    canonical_file: ???
    repo_id: huper29/huper_corrector
    audio_model_name: facebook/hubert-large-ls960-ft
    device: cuda
